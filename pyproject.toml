[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guitartab"
version = "0.2.0"
description = "YouTube URL -> guitar TAB transcription pipeline (v2, evaluation-first)"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp",
  "librosa",
  "soundfile",
  "mir_eval",
  "numpy",
]

[project.optional-dependencies]
# basic-pitch is Python 3.10-only on Apple Silicon.
# Do NOT install into the main (3.11) venv; use a dedicated 3.10 venv and the
# subprocess-based BasicPitchEngine. See README "basic-pitch の運用" for setup.
basicpitch = ["basic-pitch"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
guitartab = "guitartab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guitartab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
